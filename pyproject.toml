[project]
name = "sistema-de-notas"
version = "0.1.0"
description = "Módulo de registro de notas académicas para la Universidad Regional del Sur"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-bdd>=7.0.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "smoke: Quick tests for main functionality",
    "critical: Tests for critical paths",
    "regression: Detailed tests for regressions"
]

